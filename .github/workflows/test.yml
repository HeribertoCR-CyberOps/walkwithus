name: test
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions: {}
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: e2e (Workers runtime + D1)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit signatures
      - run: npm run typecheck
      - name: Runtime dependency audit (the Worker ships zero runtime dependencies)
        run: npm audit --omit=dev --audit-level=low
      - name: Property-based tests (fast-check, crypto core)
        run: npm run test:property
        env: { FC_RUNS: "1000" }
      - name: Outcome-study unit tests (no network)
        run: npm run test:outcomes
      - run: npm test
        env: { CI: "1", WRANGLER_SEND_METRICS: "false" }
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom, path: sbom.cdx.json, retention-days: 90 }
  ui:
    name: browser (11 languages, RTL, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Chromium for the pinned Playwright (version locked in package-lock.json)
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:ui
        env: { CI: "1", WRANGLER_SEND_METRICS: "false" }
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: ui-failures, path: ".wrangler/ui-fail-*.png", retention-days: 14 }
  ui-webkit:
    name: browser-webkit (Safari engine, every iOS browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install WebKit for the pinned Playwright
        run: npx --no-install playwright install --with-deps webkit
      - run: npm run test:ui
        env: { CI: "1", WRANGLER_SEND_METRICS: "false", ENGINE: webkit }
