version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message: { prefix: "deps", include: scope }
    ignore:
      # TypeScript 7 is the native (Go) compiler rewrite; adopt deliberately in its own PR, not as a routine bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    labels: [dependencies, ci]
    commit-message: { prefix: "ci" }
    groups:
      actions:
        patterns: ["*"]
